version = 2

[build]
cargoLock = "Cargo.lock"
cargoToml = "Cargo.toml"
devPackages = false
libPackages = false
profileName = "release"
unify = true

[build.flags]
clippy = []
doc = ["-Dwarnings"]
doctest = []
rustc = ["-Copt-level=3"]
test = []

[build.toolchain]
cargo = "cargo"
clippy = "clippy"
lld = "lld"
mold = "mold"
rustc = "rustc"
stdenv = "stdenv"

[checks]
enable = true

[checks.bans]
allow = []
deny = []
enable = true
exceptions = []

[checks.clippySuppressions]
allow = []
enable = true

[checks.codeHealth]
baseline = ".bloomery/code-health-summary.json"
crateSlocLimit = 1500
cyclomaticLimit = 10
duplicateMinTokens = 64
duplicationFreeRatio = 0.02
enable = true
functionTokensLimit = 250
maxCrateSloc = 5000
maxCyclomatic = 40
maxFunctionTokens = 1000
maxNesting = 8
maxRegression = 2
minCrateScore = 80
minWorkspaceScore = 80
nestingLimit = 4

[checks.codeHealth.weights]
complexity = 25
crateSize = 30
duplication = 15
nesting = 10
size = 20

[checks.crates]
enable = true

[checks.licenses]
allow = []
deny = []
enable = true
exceptions = []

[checks.lockFreshness]
enable = true

[checks.noDefaultFeatures]
enable = true

[checks.packages]
enable = true

[checks.specifications]
enable = true

[checks.specifications.testExceptions.acceptance_fixtures]
maxRequirements = 63
path = "acceptance.test.nix"
reason = "This file exports separate CLI, executable, IR, rejection diagnostic, and closure checks with distinct assertions. The IR contract design identifies the rejection and golden witnesses."

[checks.specifications.testExceptions.bandwidth_artifacts]
maxRequirements = 34
path = "bandwidth.test.nix"
reason = "Separate derivations assert canonical IR, Kubernetes rendering, consumer diagnostics, and byte comparisons for each packaged manifest. The bandwidth design identifies the witnesses."

[checks.specifications.testExceptions.bandwidth_vm]
maxRequirements = 6
path = "kubernetes-bandwidth.test.nix"
reason = "The K3s VM measures each direction on each network path in a separate subtest, with an uncapped baseline and three parallel flows per measurement."

[checks.specifications.testExceptions.compose_vm]
maxRequirements = 75
path = "compose.test.nix"
reason = "The Docker VM uses separate assertions for artifact integrity, Compose parsing and diagnostics, and live Docker behavior. The TARGETS design identifies the witnesses."

[checks.specifications.testExceptions.cross_system]
maxRequirements = 9
path = "systems.test.nix"
reason = "A keyed pure assertion per record checks darwin IR and reports, the runner of the other supported Linux system, and the TCG settings of both Linux systems. The harness checks each darwin selector diagnostic separately. The target design identifies the witnesses."

[checks.specifications.testExceptions.documentation]
maxRequirements = 37
path = "docs.test.nix"
reason = "Each documented block has its own record. Sandbox checks and the Docker and K3s VMs run the blocks in separate scenarios, and the coverage and stand-in checks assert each rule separately."

[checks.specifications.testExceptions.guestbook_example]
maxRequirements = 21
path = "guestbook.test.nix"
reason = "Pure checks assert validation, overlay priorities, the conflict diagnostic and the layer budget separately. The Docker and K3s VMs keep each requirement in its own subtest. The examples design identifies the witnesses."

[checks.specifications.testExceptions.image_name]
maxRequirements = 6
path = "image-name.test.nix"
reason = "This file checks image-name defaults, validation, and resolved OCI and Compose references."

[checks.specifications.testExceptions.kubernetes_artifacts]
maxRequirements = 74
path = "kubernetes.test.nix"
reason = "Separate derivations check preflight, workload, mounts, networking and standalone packaging. Each declared requirement has a keyed assertion or a file comparison."

[checks.specifications.testExceptions.kubernetes_bundle]
maxRequirements = 17
path = "kubernetes-bundle.test.nix"
reason = "Pure assertions check the namespace and Job settings. The K3s guest validates the packaged example."

[checks.specifications.testExceptions.kubernetes_vm]
maxRequirements = 23
path = "kubernetes-vm.test.nix"
reason = "The K3s VM has separate bundle comparisons, strict API validation, and live workload assertions. The Kubernetes design identifies the witnesses."

[checks.specifications.testExceptions.microvm_boot]
maxRequirements = 22
path = "microvm-boot.test.nix"
reason = "Two runner checks boot a minimal and a full fixture guest with separate artifact comparisons and live guest assertions. The microVM design identifies the witnesses."

[checks.specifications.testExceptions.microvm_bundle]
maxRequirements = 20
path = "microvm-bundle.test.nix"
reason = "Pure checks exercise report, link and host settings. Bundled runners boot both guests and verify the catalog response."

[checks.specifications.testExceptions.microvm_configuration]
maxRequirements = 45
path = "microvm.test.nix"
reason = "Each requirement has a keyed configuration assertion or a standalone file comparison that builds with an unrealizable package."

[checks.specifications.testExceptions.oci_fixtures]
maxRequirements = 34
path = "oci.test.nix"
reason = "This file exports separate preflight, OCI export, layer budget validation, and layer grouping checks. The OCI design identifies the layer assertions."

[checks.unusedDependencies]
enable = true

[checks.vulnerabilities]
ignoreAdvisories = []

[checks.vulnerabilities.informational]
notice = "warn"
unknown = "warn"
unmaintained = "warn"
unsound = "warn"

[checks.workspaceDependencies]
enable = true

[devShell]
enable = true
packages = []
shellHook = ""

[formatters]

[formatters.alejandra]
after = []
before = []
enable = true

[formatters.deadnix]
after = []
before = []
enable = true

[formatters.rustfmt]
after = []
before = []
enable = true

[formatters.shellcheck]
after = []
before = []
enable = true

[formatters.shfmt]
after = []
before = []
enable = true

[formatters.taplo]
after = []
before = []
enable = true

[formatters.toml-sort]
after = []
before = []
enable = true

[formatters.yamlfmt]
after = []
before = []
enable = true

[scanners]

[scanners.nix]
enabled = true
paths = ["*.nix"]
testPaths = ["**/*.test.nix"]

[scanners.playwright]
enabled = true
paths = ["packages/playwright/**/*.spec.ts", "packages/playwright/**/*.test.ts"]
tag_prefix = "@bloomery:"

[scanners.rust]
enabled = true
paths = ["packages/rust/**/*.rs"]

[specs]
dir = "specs"
