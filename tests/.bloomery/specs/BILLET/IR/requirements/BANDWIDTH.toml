id = "BILLET-IR-BANDWIDTH-013"
title = "Annotate Kubernetes ingress bandwidth (BI004, BI011)"
manual = false
design = "design/network-bandwidth.md#kubernetes-workload-mapping"
ears = { type = "event", trigger = "the opted-in workload declares an ingress maximum in range", system = "Billet", action = "write that rate as an exact decimal string in the Pod ingress bandwidth annotation" }

[[requirements]]
id = "BILLET-IR-BANDWIDTH-014"
title = "Annotate Kubernetes egress bandwidth (BI004, BI011)"
manual = false
design = "design/network-bandwidth.md#kubernetes-workload-mapping"
ears = { type = "event", trigger = "the opted-in workload declares an egress maximum in range", system = "Billet", action = "write that rate as an exact decimal string in the Pod egress bandwidth annotation" }

[[requirements]]
id = "BILLET-IR-BANDWIDTH-015"
