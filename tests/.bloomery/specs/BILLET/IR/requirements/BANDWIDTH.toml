manual = false
design = "design/network-bandwidth.md#kubernetes-workload-mapping"
ears = { type = "event", trigger = "an opted-in Kubernetes Job declares a bandwidth maximum", system = "Billet", action = "write its bandwidth annotation on the Job Pod template" }

[[requirements]]
id = "BILLET-IR-BANDWIDTH-016"
title = "Keep bandwidth annotations off enclosing Kubernetes objects (BI004, BI011)"
manual = false
design = "design/network-bandwidth.md#kubernetes-workload-mapping"
ears = { type = "event", trigger = "an opted-in Kubernetes workload includes a bandwidth maximum", system = "Billet", action = "omit bandwidth annotations from the top-level workload, Service and NetworkPolicy metadata" }

[[requirements]]
id = "BILLET-IR-BANDWIDTH-017"
title = "Report the Kubernetes enforcement dependency (BI004, BI011)"
manual = false
design = "design/network-bandwidth.md#kubernetes-workload-mapping"
ears = { type = "event", trigger = "an opted-in Kubernetes workload declares a bandwidth maximum", system = "Billet", action = "warn that the profile requires a configured networking plugin" }

[[requirements]]
id = "BILLET-IR-BANDWIDTH-018"
title = "Report native Kubernetes bandwidth limit mapping (BI004, BI011)"
manual = false
design = "design/network-bandwidth.md#kubernetes-workload-mapping"
ears = { type = "event", trigger = "an eligible Kubernetes workload projects a bandwidth maximum", system = "Billet", action = "include network-bandwidth-limits among its native mappings" }

