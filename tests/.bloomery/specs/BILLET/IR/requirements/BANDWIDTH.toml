schema_version = 1
group = "BANDWIDTH"

[[requirements]]
id = "BILLET-IR-BANDWIDTH-001"
title = "Omit unconfigured bandwidth (BI001, BI010)"
manual = false
design = "design/network-bandwidth.md#canonical-policy"
ears = { type = "event", trigger = "all network bandwidth fields are omitted or null", system = "Billet", action = "omit network.bandwidth from the canonical manifest" }

[[requirements]]
id = "BILLET-IR-BANDWIDTH-002"
title = "Omit an unconfigured bandwidth direction (BI001, BI010)"
manual = false
design = "design/network-bandwidth.md#canonical-policy"
ears = { type = "event", trigger = "only one direction has a configured bandwidth rate", system = "Billet", action = "omit the unset direction from canonical network.bandwidth" }

[[requirements]]
id = "BILLET-IR-BANDWIDTH-003"
title = "Omit an unconfigured bandwidth bound (BI001, BI010)"
manual = false
design = "design/network-bandwidth.md#canonical-policy"
ears = { type = "event", trigger = "an ingress or egress direction contains just one configured bound", system = "Billet", action = "omit the unset bound from the canonical direction record" }

[[requirements]]
id = "BILLET-IR-BANDWIDTH-004"
title = "Preserve configured bandwidth values (BI001, BI010)"
manual = false
design = "design/network-bandwidth.md#canonical-policy"
ears = { type = "event", trigger = "a definition supplies bandwidth rates", system = "Billet", action = "record each rate as the exact decimal bits-per-second integer in the canonical manifest" }

[[requirements]]
id = "BILLET-IR-BANDWIDTH-005"
title = "Derive the bandwidth reservations requirement (BI004, BI012)"
manual = false
design = "design/network-bandwidth.md#canonical-policy"
ears = { type = "event", trigger = "any bandwidth minimum is set", system = "Billet", action = "include network-bandwidth-reservations in the canonical required capabilities" }

[[requirements]]
id = "BILLET-IR-BANDWIDTH-006"
title = "Derive the bandwidth limits requirement (BI004, BI012)"
manual = false
design = "design/network-bandwidth.md#canonical-policy"
ears = { type = "event", trigger = "any bandwidth maximum is set", system = "Billet", action = "include network-bandwidth-limits in the canonical required capabilities" }

[[requirements]]
id = "BILLET-IR-BANDWIDTH-007"
title = "Reject a non-integer bandwidth rate (BI002)"
manual = false
design = "design/network-bandwidth.md#canonical-policy"
ears = { type = "event", trigger = "a bandwidth rate is supplied as a non-integer and non-null value", system = "Billet", action = "reject the particular bound with a nullable-integer diagnostic" }

[[requirements]]
id = "BILLET-IR-BANDWIDTH-008"
title = "Reject a nonpositive bandwidth rate (BI002)"
manual = false
design = "design/network-bandwidth.md#canonical-policy"
ears = { type = "event", trigger = "a bandwidth rate is zero or negative", system = "Billet", action = "reject the particular bound with a positive-rate diagnostic" }

[[requirements]]
id = "BILLET-IR-BANDWIDTH-009"
title = "Reject an inverted bandwidth range (BI002)"
manual = false
design = "design/network-bandwidth.md#canonical-policy"
ears = { type = "event", trigger = "a directional minimum exceeds the maximum in the same direction", system = "Billet", action = "reject the minimum field with a range-order diagnostic" }

[[requirements]]
id = "BILLET-IR-BANDWIDTH-010"
title = "Reject bandwidth minimums for Kubernetes workloads (BI004, BI011)"
manual = false
design = "design/network-bandwidth.md#kubernetes-workload-mapping"
ears = { type = "event", trigger = "a Kubernetes workload declares a bandwidth minimum", system = "Billet", action = "refuse to render with an error on each declared minimum" }

[[requirements]]
id = "BILLET-IR-BANDWIDTH-011"
title = "Require opt-in for Kubernetes bandwidth maxima (BI004, BI011)"
manual = false
design = "design/network-bandwidth.md#kubernetes-workload-mapping"
ears = { type = "event", trigger = "a Kubernetes workload declares a bandwidth maximum without the annotation profile", system = "Billet", action = "refuse to render with a bandwidth profile error" }

[[requirements]]
id = "BILLET-IR-BANDWIDTH-012"
title = "Reject Kubernetes maxima outside the annotation range (BI004, BI011)"
manual = false
design = "design/network-bandwidth.md#kubernetes-workload-mapping"
ears = { type = "event", trigger = "a declared bandwidth maximum is outside the consumer annotation range", system = "Billet", action = "refuse to render with a range error on each offending maximum" }

