group = "VALIDATION"

[[requirements]]
id = "BILLET-IR-VALIDATION-001"
title = "Field-path diagnostics (BI002)"
manual = false
design = "design/contract.md"

[requirements.ears]
type = "ubiquitous"
system = "Billet"
action = "reject invalid definitions with a field path and value-free diagnostic"

[[requirements]]
id = "BILLET-IR-VALIDATION-002"
title = "Reject unknown definition fields (BI002)"
manual = false
design = "design/contract.md#validation-and-runtime-boundary"
ears = { type = "ubiquitous", system = "Billet", action = "reject unknown definition fields before producing IR" }

[[requirements]]
id = "BILLET-IR-VALIDATION-003"
title = "Report value-free validation errors (BI002)"
manual = false
design = "design/contract.md#validation-and-runtime-boundary"
ears = { type = "ubiquitous", system = "Billet", action = "report invalid definitions with their owning field path without echoing rejected values" }

[[requirements]]
id = "BILLET-IR-VALIDATION-004"
title = "Reject wrong definition types (BI002)"
manual = false
design = "design/contract.md#validation-and-runtime-boundary"
ears = { type = "ubiquitous", system = "Billet", action = "reject definition values that do not match their declared schema types" }

[[requirements]]
id = "BILLET-IR-VALIDATION-005"
title = "Reject unsupported schema versions (BI002)"
manual = false
design = "design/contract.md#validation-and-runtime-boundary"
ears = { type = "ubiquitous", system = "Billet", action = "reject module schemaVersion values other than 1 before artifact construction" }

[[requirements]]
id = "BILLET-IR-VALIDATION-006"
title = "Reject missing probe ports (BI002)"
manual = false
design = "design/contract.md#validation-and-runtime-boundary"
ears = { type = "ubiquitous", system = "Billet", action = "reject a network probe naming an undeclared port" }

[[requirements]]
id = "BILLET-IR-VALIDATION-007"
title = "Bound declared CPU requests (BI002)"
manual = false
design = "design/contract.md#validation-and-runtime-boundary"
ears = { type = "ubiquitous", system = "Billet", action = "reject declared cpuRequest greater than cpuLimit" }

[[requirements]]
id = "BILLET-IR-VALIDATION-008"
title = "Require positive declared memory limits (BI002)"
manual = false
design = "design/contract.md#validation-and-runtime-boundary"
ears = { type = "ubiquitous", system = "Billet", action = "reject a nonpositive declared memoryLimit" }

[[requirements]]
id = "BILLET-IR-VALIDATION-009"
title = "Contain declared executable syntax (BI002)"
manual = false
design = "design/contract.md#validation-and-runtime-boundary"
ears = { type = "ubiquitous", system = "Billet", action = "reject a package-relative executable containing a parent traversal segment" }

[[requirements]]
id = "BILLET-IR-VALIDATION-010"
title = "Require a process package (BI002)"
manual = false
design = "design/contract.md#validation-and-runtime-boundary"
ears = { type = "ubiquitous", system = "Billet", action = "reject a process declaration without a package derivation" }

[[requirements]]
id = "BILLET-IR-VALIDATION-011"
title = "Require the selected system (BI002)"
manual = false
design = "design/contract.md#validation-and-runtime-boundary"
ears = { type = "ubiquitous", system = "Billet", action = "reject a systems declaration that excludes the selected package-set system" }

[[requirements]]
id = "BILLET-IR-VALIDATION-012"
title = "Require unique numeric ports (BI002)"
manual = false
design = "design/contract.md#validation-and-runtime-boundary"
ears = { type = "ubiquitous", system = "Billet", action = "reject duplicate declared network port numbers" }

[[requirements]]
id = "BILLET-IR-VALIDATION-013"
title = "Forbid overlapping storage mounts (BI002)"
manual = false
design = "design/contract.md#validation-and-runtime-boundary"
ears = { type = "ubiquitous", system = "Billet", action = "reject a storage mount nested inside another declared mount" }

[[requirements]]
id = "BILLET-IR-VALIDATION-014"
title = "Bound declared memory scratch (BI002)"
manual = false
design = "design/contract.md#validation-and-runtime-boundary"
ears = { type = "ubiquitous", system = "Billet", action = "reject total declared memory scratch exceeding the declared memoryLimit" }

[[requirements]]
id = "BILLET-IR-VALIDATION-015"
title = "Forbid persistent memory scratch (BI002)"
manual = false
design = "design/contract.md#validation-and-runtime-boundary"
ears = { type = "ubiquitous", system = "Billet", action = "reject a persistent storage declaration with medium memory" }

[[requirements]]
id = "BILLET-IR-VALIDATION-016"
title = "Contain the declared initialization budget (BI002)"
manual = false
design = "design/contract.md#validation-and-runtime-boundary"
ears = { type = "ubiquitous", system = "Billet", action = "reject an initialization budget smaller than the sum of declared step timeouts" }

[[requirements]]
id = "BILLET-IR-VALIDATION-017"
title = "Require unique initialization IDs (BI002)"
manual = false
design = "design/contract.md#validation-and-runtime-boundary"
ears = { type = "ubiquitous", system = "Billet", action = "reject duplicate declared initialization step IDs" }

[[requirements]]
id = "BILLET-IR-VALIDATION-018"
title = "Require a finite retry declaration (BI002)"
manual = false
design = "design/contract.md#validation-and-runtime-boundary"
ears = { type = "ubiquitous", system = "Billet", action = "reject a negative declared maxRetries" }

[[requirements]]
id = "BILLET-IR-VALIDATION-019"
title = "Require positive restart delay bounds (BI002)"
manual = false
design = "design/contract.md#validation-and-runtime-boundary"
ears = { type = "ubiquitous", system = "Billet", action = "reject nonpositive restart delay bounds" }

[[requirements]]
id = "BILLET-IR-VALIDATION-020"
title = "Require an increasing restart multiplier (BI002)"
manual = false
design = "design/contract.md#validation-and-runtime-boundary"
ears = { type = "ubiquitous", system = "Billet", action = "reject a declared restart multiplier no greater than one" }

[[requirements]]
id = "BILLET-IR-VALIDATION-021"
title = "Require nonnegative shutdown grace (BI002)"
manual = false
design = "design/contract.md#validation-and-runtime-boundary"
ears = { type = "ubiquitous", system = "Billet", action = "reject a negative declared stop grace period" }

[[requirements]]
id = "BILLET-IR-VALIDATION-022"
title = "Require a positive rollout deadline (BI002)"
manual = false
design = "design/contract.md#validation-and-runtime-boundary"
ears = { type = "ubiquitous", system = "Billet", action = "reject a nonpositive declared rollout progress deadline" }

[[requirements]]
id = "BILLET-IR-VALIDATION-023"
title = "Require rollout progress allowance (BI002)"
manual = false
design = "design/contract.md#validation-and-runtime-boundary"
ears = { type = "ubiquitous", system = "Billet", action = "reject a rollout declaration with zero surge and zero unavailable allowance" }

[[requirements]]
id = "BILLET-IR-VALIDATION-024"
title = "Validate singleton surge compatibility (BI002)"
manual = false
design = "design/contract.md#validation-and-runtime-boundary"
ears = { type = "ubiquitous", system = "Billet", action = "reject a strict-singleton declaration with positive rollout surge" }

[[requirements]]
id = "BILLET-IR-VALIDATION-025"
title = "Order declared replica bounds (BI002)"
manual = false
design = "design/contract.md#validation-and-runtime-boundary"
ears = { type = "ubiquitous", system = "Billet", action = "reject declared minimum replicas greater than maximum replicas" }

[[requirements]]
id = "BILLET-IR-VALIDATION-026"
title = "Reject an invalid image name (BI002)"
manual = false
design = "design/contract.md#oci-packaging-options"
ears = { type = "unwanted_behavior", trigger = "oci.imageName has uppercase path characters, an empty or tagged component, or more than 255 characters", system = "Billet", action = "fail evaluation with an oci.imageName diagnostic that does not echo the value" }

[[requirements]]
id = "BILLET-IR-VALIDATION-027"
title = "Reject an application name that cannot default the image name (BI002)"
manual = false
design = "design/contract.md#oci-packaging-options"
ears = { type = "unwanted_behavior", trigger = "oci.imageName is omitted and lowercase identity.name is not a repository name", system = "Billet", action = "fail evaluation with an oci.imageName diagnostic" }

[[requirements]]
id = "BILLET-IR-VALIDATION-028"
title = "Reject an invalid OCI layer budget (BI001, BI003, BI006)"
manual = false
design = "design/contract.md#oci-packaging-options"
ears = { type = "event", trigger = "oci.maxLayers is not an integer from 1 through 124", system = "Billet", action = "fail definition validation with an oci.maxLayers diagnostic" }

[[requirements]]
id = "BILLET-IR-VALIDATION-029"
title = "Report each rejected fixture's field and reason (BI002)"
manual = false
design = "design/contract.md#rejection-diagnostics"
ears = { type = "event", trigger = "an invalid acceptance fixture is evaluated in a separate evaluator", system = "Billet", action = "fail with the billet diagnostic for the fixture's expected field path and reason" }

[[requirements]]
id = "BILLET-IR-VALIDATION-030"
title = "Require an expected diagnostic for every invalid fixture (BI002)"
manual = false
design = "design/contract.md#rejection-diagnostics"
ears = { type = "unwanted_behavior", trigger = "an invalid acceptance fixture has no expected field path and reason, or an expectation has no fixture", system = "Billet", action = "fail rejection qualification before evaluating the fixtures" }

[[requirements]]
id = "BILLET-IR-VALIDATION-031"
title = "Omit the canary from every rejection diagnostic (BI002)"
manual = false
design = "design/contract.md#rejection-diagnostics"
ears = { type = "event", trigger = "any invalid acceptance fixture is rejected", system = "Billet", action = "emit error output that does not contain the DO-NOT-ECHO-SECRET canary" }
