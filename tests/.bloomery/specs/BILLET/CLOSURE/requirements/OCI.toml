manual = false
design = "design/oci.md#determinism-and-provenance"
ears = { type = "ubiquitous", system = "Billet", action = "set OCI rootfs DiffIDs to the digests of the actual uncompressed layer bytes" }

[[requirements]]
id = "BILLET-CLOSURE-OCI-007"
title = "Bind versioned provenance (BI003, BI006, BI010)"
manual = false
design = "design/oci.md#determinism-and-provenance"
ears = { type = "ubiquitous", system = "Billet", action = "bind versioned OCI provenance to manifest, closure, image and pinned backend identities" }

[[requirements]]
id = "BILLET-CLOSURE-OCI-008"
title = "Export deterministic OCI bytes (BI003, BI006, BI010)"
manual = false
design = "design/oci.md#determinism-and-provenance"
ears = { type = "ubiquitous", system = "Billet", action = "produce the same OCI inventory and file bytes on independent exports of one image" }

[[requirements]]
id = "BILLET-CLOSURE-OCI-009"
