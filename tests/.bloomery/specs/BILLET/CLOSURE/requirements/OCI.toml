schema_version = 1
group = "OCI"

[[requirements]]
id = "BILLET-CLOSURE-OCI-001"
title = "OCI images contain the complete runtime closure (BI003, BI006)"
manual = false
design = "design/oci.md"
ears = { type = "ubiquitous", system = "Billet", action = "package precisely the realized runtime closure with reference-only metadata and preserved execution parameters" }

[[requirements]]
id = "BILLET-CLOSURE-OCI-002"
title = "OCI images have deterministic versioned provenance (BI001, BI010)"
manual = false
design = "design/oci.md"
ears = { type = "ubiquitous", system = "Billet", action = "produce reproducible OCI blobs and versioned provenance binding system, manifest and image identities" }

[[requirements]]
id = "BILLET-CLOSURE-OCI-003"
title = "Preserve OCI command arrays (BI003, BI006, BI010)"
manual = false
design = "design/oci.md#contents-and-execution-parameters"
ears = { type = "ubiquitous", system = "Billet", action = "preserve the declared executable and argv as OCI Entrypoint and Cmd arrays" }

[[requirements]]
id = "BILLET-CLOSURE-OCI-004"
title = "Include the exact runtime filesystem (BI003, BI006, BI010)"
manual = false
design = "design/oci.md#contents-and-execution-parameters"
ears = { type = "ubiquitous", system = "Billet", action = "include the descriptor runtime filesystem with unchanged file bytes, modes and symlinks and no unrelated store paths" }

