group = "EXAMPLES"

[[requirements]]
id = "BILLET-PUBLIC-EXAMPLES-001"
title = "Publish guestbook validation checks (BI009)"
manual = false
design = "design/examples.md#layered-modules"
ears = { type = "event", trigger = "the guestbook example flake is evaluated", system = "Billet", action = "publish the dev and prod bundles, each with guestbook and postgres members, and a flake validation check for every bundle and member" }

[[requirements]]
id = "BILLET-PUBLIC-EXAMPLES-002"
title = "Replace mkDefault base values with plain overlay values (BI001)"
manual = false
design = "design/examples.md#layered-modules"
ears = { type = "event", trigger = "an environment overlay plainly defines a field that the shared base module defines with lib.mkDefault", system = "Billet", action = "normalize the overlay value for that field and keep the base default for fields the overlay leaves unset" }

[[requirements]]
id = "BILLET-PUBLIC-EXAMPLES-003"
title = "Replace plain base values with mkForce overlay values (BI001)"
manual = false
design = "design/examples.md#layered-modules"
ears = { type = "event", trigger = "an environment overlay defines a field with lib.mkForce that the shared base module defines plainly", system = "Billet", action = "normalize the forced value without a conflict while other plain base values pass through unchanged" }

[[requirements]]
id = "BILLET-PUBLIC-EXAMPLES-004"
title = "Diagnose conflicting plain overlay definitions (BI002)"
manual = false
design = "design/examples.md#layered-modules"
ears = { type = "unwanted_behavior", trigger = "two modules plainly define the same scalar field with different values", system = "Billet", action = "fail evaluation with billet: <field path>: conflicting definitions and omit both values from the message" }

